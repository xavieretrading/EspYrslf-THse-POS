runtime: nodejs22

env: standard

entrypoint: npm start

env_variables:
  VITE_SUPABASE_URL: ""
  VITE_SUPABASE_ANON_KEY: ""
  DATABASE_URL: ""
  GEMINI_API_KEY: ""
  NODE_ENV: "production"
  TZ: "Asia/Manila"

automatic_scaling:
  min_instances: 1
  max_instances: 5

app_engine_apis: true

handlers:
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301
