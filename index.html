<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>POS</title>
  <link rel="manifest" href="/manifest.json" />

  <!-- Mobile Capable Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="POS" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="theme-color" content="#0f172a" />

  <!-- PWA Service Worker & Capacitor API Redirect -->
  <script>
    const API_BASE = 'https://lr-groupofcompanies-pos-system-794666981380.europe-west1.run.app';

    // Intercept native capacitor app API fetches to redirect relative requests to Cloud Run
    const originalFetch = window.fetch;
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.startsWith('/api/')) {
        const isNativeApp = window.location.protocol === 'capacitor:';
        if (isNativeApp) {
          input = API_BASE + input;
        }
      }
      return originalFetch(input, init);
    };

    // Only register service worker in production, never on localhost to avoid stale cache
    if ('serviceWorker' in navigator && window.location.protocol !== 'capacitor:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    } else if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      // Unregister any old service workers on localhost to ensure fresh hot reload
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) reg.unregister();
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
