<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AllSet POS</title>
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Mobile Capable Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AllSet POS" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="theme-color" content="#0f172a" />

  <!-- PWA Service Worker & Capacitor API Redirect -->
  <script>
    const API_BASE = 'https://lr-groupofcompanies-pos-system-794666981380.europe-west1.run.app';

    // Intercept native app API fetches to redirect relative requests to Cloud Run
    const originalFetch = window.fetch;
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.startsWith('/api/')) {
        const isNativeApp = window.location.protocol === 'capacitor:' || 
                            (window.location.hostname === 'localhost' && window.location.port !== '5173' && window.location.port !== '3000');
        if (isNativeApp) {
          input = API_BASE + input;
        }
      }
      return originalFetch(input, init);
    };

    if ('serviceWorker' in navigator && window.location.protocol !== 'capacitor:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
